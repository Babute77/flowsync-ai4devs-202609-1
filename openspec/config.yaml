schema: spec-driven

context: |
  Escribe todos los artefactos en español.
  Monorepo sin package.json raíz: los comandos se ejecutan desde backend/ o frontend/.
  Backend (AdonisJS 7, Lucid 22, VineJS 4):
    - database/schema.ts es autogenerado desde las migraciones; nunca se edita. Los modelos solo añaden relaciones, mixins y lógica.
    - Toda respuesta pasa por serialize() con un transformer de app/transformers/, nunca modelos crudos.
    - Imports por subpath (#controllers/*, #models/*, ...), no rutas relativas.
    - Los tests functional comparten el fichero SQLite del servidor de desarrollo: aislar con testUtils.db().
  Frontend (React 19, Vite 8, Tailwind v4, shadcn/ui):
    - Lint con oxlint (no eslint); no hay runner de tests.
    - Toda llamada a la API va en src/lib/api.ts, no en los componentes.
    - Los componentes de src/components/ui/ se traen con shadcn y no se editan a mano.
  Proceso: rama feat/<slug> (nunca commitear en main ni s1/start), skill /commit, gh pr create con descripción completa y revisión con el subagente adversarial-reviewer.

rules:
  proposal:
    - Declara explícitamente qué queda fuera de alcance
  design:
    - Indica si el cambio requiere migración y regenerar database/schema.ts y .adonisjs/
  tasks:
    - Incluye una tarea de verificación (typecheck/lint/test del backend o build/lint del frontend según corresponda)
